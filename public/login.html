<!DOCTYPE html>
<html>

<head>
    <base href="/">
    <meta charset="utf-8">
    <meta name="viewport"
        content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="darkreader-lock">
    <meta name="robots" content="noindex, nofollow" />
    <style>
        /* Put critical CSS here. The rest should go in stylesheets. */
        body {
            background-color: rgb(36, 36, 37);
        }
    </style>
    <link rel="preload" as="style" href="style.css">
    <link rel="apple-touch-icon" sizes="57x57" href="img/apple-icon-57x57.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="img/apple-icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="img/apple-icon-114x114.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="img/apple-icon-144x144.png" />
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="css/login.css">
    <link rel="manifest" crossorigin="use-credentials" href="manifest.json">
    <link href="webfonts/NotoSans/stylesheet.css" rel="stylesheet">
    <link href="webfonts/NotoSansMono/stylesheet.css" rel="stylesheet">
    <link href="css/fontawesome.min.css" rel="stylesheet">
    <link href="css/solid.min.css" rel="stylesheet">
    <title>SillyTavern</title>
</head>

<body class="login">
    <div class="background-overlay"></div>
    <div id="shadow_popup">
        <div id="dialogue_popup">
            <div id="dialogue_popup_holder">
                <div id="dialogue_popup_text">
                    <div id="userSelectBlock" class="login-card">

                        <div class="login-visual">
                            <!-- Side image will be loaded here via CSS/JS -->
                        </div>

                        <div class="login-content">
                            <div class="logo-header">
                                <img src="img/logo.png" alt="SillyTavern" class="logo">
                                <h2>SillyTavern</h2>
                            </div>
                            <!-- 
                            <h3 id="normalLoginPrompt" class="login-subtitle">
                                Welcome Back
                            </h3>
                            <h3 id="discreetLoginPrompt" class="login-subtitle">
                                Login
                            </h3> -->

                            <div id="userListBlock" class="user-list-block">
                                <div id="userList" class="user-grid"></div>

                                <div id="handleEntryBlock" style="display:none;" class="input-group">
                                    <input id="userHandle" class="text_pole modern-input" type="text"
                                        placeholder="User Handle" autocomplete="username">
                                </div>

                                <div id="passwordEntryBlock" style="display:none;" class="input-group">
                                    <input id="userPassword" class="text_pole modern-input" type="password"
                                        placeholder="Password" autocomplete="current-password">
                                    <div class="actions">
                                        <div id="loginButton" class="menu_button primary-btn">Login</div>
                                        <a id="recoverPassword" href="#" onclick="return false;"
                                            class="forgot-link">Forgot password?</a>
                                        <div class="divider">or</div>
                                        <div id="showSignupButton" class="menu_button secondary-btn">Create Account
                                        </div>
                                    </div>
                                </div>

                                <div id="signupBlock" style="display:none;" class="input-group">
                                    <input id="signupUserId" class="text_pole modern-input" type="text"
                                        placeholder="Afdian User ID" autocomplete="off">
                                    <input id="signupOrderId" class="text_pole modern-input" type="text"
                                        placeholder="Afdian Order ID" autocomplete="off">
                                    <input id="signupName" class="text_pole modern-input" type="text"
                                        placeholder="Nickname" autocomplete="nickname">
                                    <input id="signupPassword" class="text_pole modern-input" type="password"
                                        placeholder="Password" autocomplete="new-password">
                                    <div class="actions">
                                        <div id="doSignupButton" class="menu_button primary-btn">Sign Up</div>
                                        <div id="cancelSignupButton" class="menu_button secondary-btn">Back to Login
                                        </div>
                                    </div>
                                </div>

                                <div id="passwordRecoveryBlock" style="display:none;" class="recovery-group">
                                    <div id="recoverMessage" class="info-message">
                                        请在爱发电站内信联系并发送user id重置密码
                                    </div>
                                    <div class="actions-row">
                                        <div id="cancelRecovery" class="menu_button secondary-btn">Back</div>
                                    </div>
                                </div>
                            </div>

                            <div class="neutral_warning error-message" id="errorMessage"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="lib/jquery-3.5.1.min.js"></script>
    <script src="scripts/login.js" type="module"></script>
</body>

</html>
